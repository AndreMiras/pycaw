[tox]
envlist = lint-check,py{310,311,312,313,314}-{minimum,current},wheel-smoke

[testenv]
runner = uv-venv-runner
package = wheel
dependency_groups = test
setenv =
    SOURCES = pycaw tests examples
deps =
    minimum: -r{toxinidir}/requirements.txt
    current: comtypes
    current: psutil
commands = pytest tests/

[testenv:py314-current]
dependency_groups =
    test
    coverage
commands = pytest --cov=pycaw --cov-report term --cov-report xml tests/

[testenv:coveralls]
runner = uv-venv-lock-runner
package = skip
dependency_groups =
only_groups = coverage-upload
passenv = GITHUB_*
setenv =
    COVERALLS_SERVICE_NAME = github
commands = coveralls

[testenv:lint-check]
runner = uv-venv-lock-runner
package = skip
dependency_groups =
only_groups = lint
commands =
    ruff check {env:SOURCES}
    ruff format --check {env:SOURCES}

[testenv:lint-format]
runner = uv-venv-lock-runner
package = skip
dependency_groups =
only_groups = lint
commands =
    ruff check --fix {env:SOURCES}
    ruff format {env:SOURCES}

[testenv:wheel-smoke]
runner = uv-venv-runner
base_python = 3.14
package = wheel
dependency_groups =
change_dir = {env:RUNNER_TEMP:{env_tmp_dir}}
commands =
    python {toxinidir}/tests/wheel_smoke.py {toxinidir}
