[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pycaw"
version = "20260921.dev0"
description = "Python Core Audio Windows Library"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andre Miras" }]
dependencies = [
  "comtypes>=1.4.8",
  "psutil>=5.9.0",
]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[dependency-groups]
test = ["pytest"]
coverage = ["pytest-cov"]
coverage-upload = ["coveralls"]
lint = ["ruff"]
docs = [
  "sphinx>=9.1.0",
  "sphinx-rtd-theme>=3.1.0",
  "sphinx-autodoc-typehints>=3.13.7",
]
release = ["build", "twine"]
tox = ["tox", "tox-uv-bare"]
dev = [
  { include-group = "test" },
  { include-group = "coverage" },
  { include-group = "lint" },
  { include-group = "tox" },
]

[project.urls]
Homepage = "https://github.com/AndreMiras/pycaw"
Documentation = "https://andremiras.github.io/pycaw/"
Repository = "https://github.com/AndreMiras/pycaw.git"
Issues = "https://github.com/AndreMiras/pycaw/issues"
Changelog = "https://github.com/AndreMiras/pycaw/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["pycaw*"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"pycaw/magic.py" = ["E402", "I001"]

[tool.coverage.run]
relative_files = true
source = ["pycaw"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.14" }
